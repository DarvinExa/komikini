; ==============================================================================
; Komikini Dedicated PHP-FPM Pool Configuration
; Target: /etc/php/8.3/fpm/pool.d/komikini.conf
; ==============================================================================

[komikini]

user = www-data
group = www-data

listen = /run/php/php8.3-fpm-komikini.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process Management tuned for 2 vCPU / 4 GB RAM baseline
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.process_idle_timeout = 10s
pm.max_requests = 1000

; Health & Ping check for local monitoring
ping.path = /fpm-ping
ping.response = pong
pm.status_path = /fpm-status

; Timeouts & Safety
request_terminate_timeout = 60s
request_slowlog_timeout = 5s
slowlog = /var/log/php8.3-fpm-komikini.slow.log

; Logging
catch_workers_output = yes
decorate_workers_output = no

; Preserve environment variables
clear_env = no

; PHP INI overrides for this application pool
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.3-fpm-komikini.log
php_admin_value[expose_php] = Off
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_secure] = 1
php_admin_value[session.cookie_samesite] = Lax
