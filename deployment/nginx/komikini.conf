# ==============================================================================
# Komikini Production Nginx Server Configuration
# Optimized for Ubuntu 24.04, PHP 8.3-FPM, and Cloudflare Edge Proxy
# ==============================================================================

# Rate limiting zones based on real client IP (populated via Cloudflare header)
limit_req_zone $binary_remote_addr zone=komikini_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=komikini_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=komikini_search:10m rate=10r/s;

# ------------------------------------------------------------------------------
# HTTP -> HTTPS Redirect Server Block
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name komikini.com www.komikini.com;

    # Allow Let's Encrypt ACME challenge if not using Cloudflare Origin CA
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/komikini/current/public;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS Main Server Block
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name komikini.com www.komikini.com;

    # Document Root points to atomic release symlink
    root /var/www/komikini/current/public;
    index index.php;

    # SSL / TLS Hardening
    ssl_certificate /etc/ssl/certs/komikini_origin.pem;
    ssl_certificate_key /etc/ssl/private/komikini_origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Include Cloudflare IP Ranges to restore real visitor IP
    include /etc/nginx/snippets/cloudflare-ips.conf;

    # Character set & maximum request payload
    charset utf-8;
    client_max_body_size 12M;

    # Custom Log format with correlation ID and upstream timing
    log_format komikini_combined '$remote_addr - $remote_user [$time_local] '
                                 '"$request" $status $body_bytes_sent '
                                 '"$http_referer" "$http_user_agent" '
                                 'cf_ip="$http_cf_connecting_ip" '
                                 'correlation_id="$http_x_correlation_id" '
                                 'rt=$request_time uct="$upstream_connect_time" '
                                 'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/komikini_access.log komikini_combined buffer=32k flush=5s;
    error_log /var/log/nginx/komikini_error.log warn;

    # Security Headers (Defense in Depth alongside Laravel Middleware)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # Health Probe Endpoints (Bypass Rate Limiting & Suppress Access Logs for /up)
    # --------------------------------------------------------------------------
    location = /up {
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /health/ready {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --------------------------------------------------------------------------
    # Static Assets Caching (Vite build chunks & public storage)
    # --------------------------------------------------------------------------
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ^~ /storage/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        try_files $uri /index.php?$query_string;
    }

    location = /sitemap.xml {
        try_files $uri /index.php?$query_string;
    }

    # --------------------------------------------------------------------------
    # Specific Rate-Limited Endpoints
    # --------------------------------------------------------------------------
    location /login {
        limit_req zone=komikini_auth burst=10 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /register {
        limit_req zone=komikini_auth burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /search {
        limit_req zone=komikini_search burst=15 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --------------------------------------------------------------------------
    # General Web Routing
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=komikini_general burst=50 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --------------------------------------------------------------------------
    # PHP-FPM FastCGI Handler
    # --------------------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm-komikini.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Forward headers for tracking and secure proxying
        fastcgi_param HTTP_X_CORRELATION_ID $http_x_correlation_id;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
        fastcgi_param HTTP_CF_RAY $http_cf_ray;

        # Timeout buffers
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 30s;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_intercept_errors off;
    }

    # --------------------------------------------------------------------------
    # Security: Deny Access to Hidden Files, Sensitive Extensions, and Dotfiles
    # --------------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|lock|yml|yaml|json|sql|sh|md|log|ini|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
