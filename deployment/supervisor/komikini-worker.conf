; ==============================================================================
; Supervisor Queue Worker Configuration for Komikini
; Target: /etc/supervisor/conf.d/komikini-worker.conf
; ==============================================================================

[program:komikini-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/komikini/current/artisan queue:work redis --queue=default,analytics,notifications --sleep=3 --tries=3 --max-time=3600 --memory=128
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/komikini-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3600
