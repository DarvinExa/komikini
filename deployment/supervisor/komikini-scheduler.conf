; ==============================================================================
; Supervisor Scheduler Runner Configuration for Komikini
; Target: /etc/supervisor/conf.d/komikini-scheduler.conf
; Note: Alternatively, a 1-minute system crontab entry can be used.
; ==============================================================================

[program:komikini-scheduler]
process_name=%(program_name)s
command=php /var/www/komikini/current/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/komikini-scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=60
