name: Komikini CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates & Automated Tests
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: komikini_test
          POSTGRES_USER: komikini_test
          POSTGRES_PASSWORD: secret_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pgsql, redis, bcmath, curl, gd
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM Dependencies
        run: npm ci

      - name: Check PHP Code Style (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Check ESLint Rules
        run: npm run lint

      - name: Check TypeScript Compilation
        run: npx tsc --noEmit

      - name: Build Frontend Production Assets
        run: npm run build

      - name: Setup Test Environment Configuration
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      - name: Execute Full Test Suite
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: komikini_test
          DB_USERNAME: komikini_test
          DB_PASSWORD: secret_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CACHE_STORE: redis
          QUEUE_CONNECTION: sync
        run: php artisan test --parallel

  deploy-staging:
    name: Deploy to Staging Environment
    needs: quality-gates
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04

    steps:
      - name: Trigger Staging Deployment via SSH
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${STAGING_HOST}" ]; then
            echo "Notice: STAGING_HOST secret not configured. Skipping automated remote deployment."
            exit 0
          fi
          echo "Connecting to staging server and executing deploy.sh..."
          # ssh -o StrictHostKeyChecking=no ${STAGING_USER}@${STAGING_HOST} "/var/www/komikini/deployment/scripts/deploy.sh main"
